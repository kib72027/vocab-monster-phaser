<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reading Plus 單字打怪王 (Phaser)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0D1626;
      overflow: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #9babc4;
      font-size: 15px;
      text-align: center;
      z-index: 10;
      line-height: 1.7;
      max-width: 90%;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="status">載入 Phaser 中...</div>
  <div id="game-container"></div>

  <script>
    var statusEl = document.getElementById("status");

    function showError(msg) {
      statusEl.innerHTML = msg;
      statusEl.style.color = "#ff7a7f";
    }

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = function () {
          reject(new Error("無法載入：" + src));
        };
        document.head.appendChild(s);
      });
    }

    // 依序載入：Phaser → data.js → game.js
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/phaser/3.87.0/phaser.min.js")
      .catch(function () {
        // 備用 CDN
        return loadScript("https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js");
      })
      .then(function () {
        if (typeof Phaser === "undefined") {
          throw new Error("Phaser 載入後仍無法使用");
        }
        statusEl.innerHTML = "載入遊戲資料中...";
        return loadScript("js/data.js");
      })
      .then(function () {
        statusEl.innerHTML = "載入遊戲中...";
        return loadScript("js/game.js");
      })
      .then(function () {
        statusEl.style.display = "none";
      })
      .catch(function (err) {
        showError("載入失敗<br><br>" + err.message + "<br><br>請重新整理或檢查網路");
        console.error(err);
      });
  </script>
</body>
</html>
